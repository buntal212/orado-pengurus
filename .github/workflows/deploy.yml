name: Deploy ORADO Pengurus

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create production env
        run: |
          echo 'VITE_APP_NAME="Orado Pengurus"' > .env.production
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> .env.production

      - name: Check production env
        run: |
          echo "=== .env.production ==="
          cat .env.production
          echo "======================="

      - name: Build Quasar PWA
        run: npm run build

      - name: Check built API URL
        run: |
          echo "=== CARI URL DEVELOPMENT ==="
          grep -R "api-orado.test" dist/pwa || true

          echo "=== CARI URL PRODUCTION ==="
          grep -R "apiorado.orado-kota-probolinggo.my.id" dist/pwa || true

          echo "=== SELESAI ==="

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "echo 'SSH ORADO Pengurus berhasil' && whoami"

      - name: Deploy
        run: |
          rsync -avz --delete \
            --exclude='.well-known/' \
            --exclude='.htaccess' \
            --exclude='.user.ini' \
            --exclude='404.html' \
            --exclude='502.html' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            dist/pwa/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/www/wwwroot/pengurusapp.orado-kota-probolinggo.my.id/"