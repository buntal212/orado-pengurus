name: Deploy ORADO Pengurus

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create production env
        run: |
          echo 'VITE_APP_NAME="Orado Pengurus"' > .env.production
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> .env.production
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env.production
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env.production
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env.production
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> .env.production
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> .env.production
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env.production
          echo "VITE_FIREBASE_VAPID_KEY=${{ secrets.VITE_FIREBASE_VAPID_KEY }}" >> .env.production

          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> $GITHUB_ENV
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> $GITHUB_ENV
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> $GITHUB_ENV
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> $GITHUB_ENV
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> $GITHUB_ENV
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> $GITHUB_ENV
          echo "VITE_FIREBASE_VAPID_KEY=${{ secrets.VITE_FIREBASE_VAPID_KEY }}" >> $GITHUB_ENV

      - name: Verify production env
        run: |
          test -n "${{ secrets.VITE_API_URL }}" || (echo "VITE_API_URL kosong" && exit 1)
          test -n "${{ secrets.VITE_FIREBASE_API_KEY }}" || (echo "VITE_FIREBASE_API_KEY kosong" && exit 1)
          test -n "${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" || (echo "VITE_FIREBASE_AUTH_DOMAIN kosong" && exit 1)
          test -n "${{ secrets.VITE_FIREBASE_PROJECT_ID }}" || (echo "VITE_FIREBASE_PROJECT_ID kosong" && exit 1)
          test -n "${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" || (echo "VITE_FIREBASE_STORAGE_BUCKET kosong" && exit 1)
          test -n "${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" || (echo "VITE_FIREBASE_MESSAGING_SENDER_ID kosong" && exit 1)
          test -n "${{ secrets.VITE_FIREBASE_APP_ID }}" || (echo "VITE_FIREBASE_APP_ID kosong" && exit 1)
          test -n "${{ secrets.VITE_FIREBASE_VAPID_KEY }}" || (echo "VITE_FIREBASE_VAPID_KEY kosong" && exit 1)
          echo "Semua production environment tersedia."

      - name: Build Quasar PWA
        run: npm run build

      - name: Check development URL
        run: |
          if grep -R "api-orado.test" dist/pwa; then
            echo "ERROR: URL development masih ditemukan!"
            exit 1
          else
            echo "OK: URL development tidak ditemukan."
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "echo 'SSH ORADO Pengurus berhasil' && whoami"

      - name: Deploy
        run: |
          rsync -avz --delete \
            --exclude='.well-known/' \
            --exclude='.htaccess' \
            --exclude='.user.ini' \
            --exclude='404.html' \
            --exclude='502.html' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            dist/pwa/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/www/wwwroot/pengurusapp.orado-kota-probolinggo.my.id/"

      - name: Verify PWA service worker production
        run: |
          response_headers="$(curl --fail --silent --show-error --location --retry 3 --head https://pengurusapp.orado-kota-probolinggo.my.id/sw.js)"
          echo "$response_headers"
          echo "$response_headers" | grep -qiE '^content-type: (application|text)/javascript' || {
            echo 'ERROR: sw.js harus dilayani sebagai JavaScript agar PWA dan FCM Android dapat aktif.'
            exit 1
          }
